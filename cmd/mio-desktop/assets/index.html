<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mio Money · 总览</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo">MIO<i>.</i></span>
    <nav class="nav" role="tablist" aria-label="页面">
      <button class="nav-item active" type="button" role="tab" data-view="overview" aria-selected="true">总览</button>
      <button class="nav-item" type="button" role="tab" data-view="pending" aria-selected="false">
        待确认<span id="pending-count" class="count" hidden></span>
      </button>
      <button id="nav-loan" class="nav-item" type="button" role="tab" data-view="loan" aria-selected="false" hidden>房贷还款计划</button>
    </nav>
    <div class="spacer"></div>
    <span class="topbar-note">只统计已确认快照 · CNY</span>
    <button id="refresh" class="btn" type="button">刷新</button>
  </header>

  <div id="status" class="status" role="status" hidden></div>

  <main class="wrap">
    <section id="overview-view" class="view">
      <section id="overview-empty" class="panel guide" hidden>
        <h2>还没有资产数据</h2>
        <p>让 Agent 通过 MCP 的 <code>submit_snapshot</code> 写入第一份快照；没有命中异常时让 Agent 用 <code>confirm_snapshot</code> 确认，命中异常的记录会在「待确认」里等你处理。</p>
      </section>

      <div id="overview-body">
        <div class="kpis">
          <section class="panel kpi hero-kpi">
            <div class="lab">净资产 <span id="net-asof"></span></div>
            <div id="net-worth" class="kv num">¥0.00</div>
            <div id="net-change" class="delta num" hidden></div>
          </section>
          <section class="panel kpi">
            <div class="lab">资产</div>
            <div id="assets" class="kv s num">¥0.00</div>
            <div id="asset-count" class="delta muted"></div>
          </section>
          <section class="panel kpi">
            <div class="lab">负债</div>
            <div id="liabilities" class="kv s num neg">¥0.00</div>
            <div id="liability-count" class="delta muted"></div>
          </section>
          <section class="panel kpi">
            <div class="lab">下期月供</div>
            <div id="next-loan" class="kv s num amb">—</div>
            <div id="next-loan-meta" class="delta muted"></div>
          </section>
        </div>

        <div class="row2">
          <section class="panel">
            <div class="ph"><h2>净资产走势</h2><span id="chart-note"></span></div>
            <div id="chart" class="chart"></div>
          </section>
          <section class="panel">
            <div class="ph"><h2>资产构成</h2><span>按类型</span></div>
            <div id="allocation" class="alloc"></div>
          </section>
        </div>

        <section class="panel">
          <div class="ph"><h2>账户</h2><span id="account-count"></span></div>
          <div class="table-wrap">
            <table class="accounts-table">
              <thead>
                <tr>
                  <th class="l">账户</th>
                  <th>金额</th>
                  <th>占净资产</th>
                  <th>最新快照</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="accounts"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section id="pending-view" class="view" hidden>
      <section class="panel">
        <div class="ph"><h2>待确认快照</h2><span>被异常规则拦下的记录，确认生效后才会写入正式数据</span></div>
        <div id="list" class="list"></div>
        <div id="empty" class="empty" hidden>没有需要你确认的快照</div>
      </section>
    </section>

    <section id="loan-view" class="view" hidden>
      <div id="loan-form-host"></div>
    </section>
  </main>

  <template id="card">
    <article class="card">
      <div class="card-head">
        <div>
          <h2 class="account"></h2>
          <p class="meta"></p>
        </div>
        <span class="badge">需要确认</span>
      </div>
      <section>
        <h3>命中规则</h3>
        <ul class="anomalies"></ul>
      </section>
      <section>
        <h3>与上次对比</h3>
        <ul class="diff"></ul>
      </section>
      <div class="actions">
        <button class="approve" type="button">确认生效</button>
        <button class="reject secondary" type="button">丢弃</button>
      </div>
      <div class="confirm-panel" hidden>
        <p class="confirm-text"></p>
        <label class="reason-field" hidden>
          <span>丢弃原因（可选）</span>
          <textarea class="reason" maxlength="500" placeholder="可选：丢弃原因"></textarea>
        </label>
        <div class="confirm-actions">
          <button class="confirm-submit" type="button">确认</button>
          <button class="confirm-cancel secondary" type="button">取消</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
