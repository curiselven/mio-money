<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mio · 总览</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Mio Money</p>
      <h1 id="title">总览</h1>
      <p id="subtitle" class="subtitle">只统计已确认快照。</p>
    </div>
    <button id="refresh" class="secondary" type="button">刷新</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="页面">
    <button id="tab-overview" class="tab active" type="button" role="tab" data-view="overview" aria-selected="true">总览</button>
    <button id="tab-pending" class="tab" type="button" role="tab" data-view="pending" aria-selected="false">
      待确认<span id="pending-count" class="count" hidden></span>
    </button>
  </nav>

  <div id="status" class="status" role="status" hidden></div>

  <main id="overview-view" class="view">
    <section id="overview-empty" class="card guide" hidden>
      <h2>还没有资产数据</h2>
      <p>让 Agent 通过 MCP 的 <code>submit_snapshot</code> 写入第一份快照；没有命中异常时让 Agent 用 <code>confirm_snapshot</code> 确认，命中异常的记录会在「待确认」里等你处理。</p>
    </section>

    <div id="overview-body">
      <section class="card hero">
        <p class="hero-label">净资产 <span id="net-asof" class="hero-date"></span></p>
        <p id="net-worth" class="hero-value">¥0.00</p>
        <p id="net-change" class="change" hidden></p>
        <dl class="hero-split">
          <div><dt>资产</dt><dd id="assets">¥0.00</dd></div>
          <div><dt>负债</dt><dd id="liabilities">¥0.00</dd></div>
        </dl>
      </section>

      <section class="card">
        <h2 class="card-title">账户</h2>
        <div id="accounts" class="accounts"></div>
      </section>

      <section class="card">
        <h2 class="card-title">净资产走势</h2>
        <div id="chart" class="chart"></div>
      </section>
    </div>
  </main>

  <section id="pending-view" class="view" hidden>
    <main id="list" class="list"></main>
    <div id="empty" class="empty" hidden>没有需要你确认的快照</div>
  </section>

  <template id="card">
    <article class="card">
      <div class="card-head">
        <div>
          <h2 class="account"></h2>
          <p class="meta"></p>
        </div>
        <span class="badge">需要确认</span>
      </div>
      <section>
        <h3>命中规则</h3>
        <ul class="anomalies"></ul>
      </section>
      <section>
        <h3>与上次对比</h3>
        <ul class="diff"></ul>
      </section>
      <div class="actions">
        <button class="approve" type="button">确认生效</button>
        <button class="reject secondary" type="button">丢弃</button>
      </div>
      <div class="confirm-panel" hidden>
        <p class="confirm-text"></p>
        <label class="reason-field" hidden>
          <span>丢弃原因（可选）</span>
          <textarea class="reason" maxlength="500" placeholder="可选：丢弃原因"></textarea>
        </label>
        <div class="confirm-actions">
          <button class="confirm-submit" type="button">确认</button>
          <button class="confirm-cancel secondary" type="button">取消</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
